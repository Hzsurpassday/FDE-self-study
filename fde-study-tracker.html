5", "difficulty": 2, "type": "single", "question": "政务AI应用需要覆盖哪些渠道？", "options": ["A. 只需要网站", "B. 网站/APP/窗口/电话等全渠道", "C. 只需要电话", "D. 不需要线上渠道"], "correctAnswer": 1, "explanation": "政务场景需要覆盖全渠道：网站、APP、微信小程序、12345热线、实体窗口等。"}, {"id": "q075", "module": 4, "topic": "4.6", "difficulty": 1, "type": "single", "question": "制造业AI应用中，视觉检测主要用于什么？", "options": ["A. 文本处理", "B. 产品质量检测和缺陷分类", "C. 音频处理", "D. 视频通话"], "correctAnswer": 1, "explanation": "视觉检测利用AI图像识别技术进行产品质量检测和缺陷分类。"}, {"id": "q076", "module": 4, "topic": "4.6", "difficulty": 2, "type": "single", "question": "零售业AI应用中，库存管理的核心功能是什么？", "options": ["A. 装饰店面", "B. 需求预测和自动补货", "C. 招聘员工", "D. 设计广告"], "correctAnswer": 1, "explanation": "AI库存管理通过需求预测自动调整库存水平，实现自动补货，减少库存积压和缺货。"}, {"id": "q077", "module": 4, "topic": "4.7", "difficulty": 1, "type": "single", "question": "医疗AI应用中，以下哪个是必须的合规要求？", "options": ["A. 可以替代医生诊断", "B. 标注'仅供参考'，不能替代医生诊断", "C. 不需要隐私保护", "D. 不需要准确性"], "correctAnswer": 1, "explanation": "医疗AI必须标注'仅供参考'，不能替代医生诊断，患者数据需脱敏保护。"}, {"id": "q078", "module": 4, "topic": "4.7", "difficulty": 2, "type": "single", "question": "教育AI应用相比真人教师的优势是什么？", "options": ["A. 完全替代教师", "B. 24小时在线、无限耐心、个性化", "C. 不需要教学内容", "D. 不需要评估效果"], "correctAnswer": 1, "explanation": "教育AI的优势在于24小时在线、无限耐心、能根据学生水平个性化调整。"}, {"id": "q079", "module": 4, "topic": "4.1", "difficulty": 3, "type": "single", "question": "客户说'我们想要一个AI客服'，FDE首先应该做什么？", "options": ["A. 立即开始开发", "B. 通过SPIN分析了解根本需求", "C. 拒绝客户", "D. 推荐最贵的方案"], "correctAnswer": 1, "explanation": "FDE应首先通过SPIN等框架深入分析客户的根本需求，而非直接跳到解决方案。"}, {"id": "q080", "module": 4, "topic": "4.3", "difficulty": 3, "type": "single", "question": "技术规格书中不需要包含以下哪项？", "options": ["A. 架构设计", "B. 性能指标", "C. 团队成员的生日", "D. 接口定义"], "correctAnswer": 2, "explanation": "技术规格书包括架构设计、模型选型、知识库设计、工作流设计、接口定义、性能指标等。"}, {"id": "q081", "module": 4, "topic": "4.4", "difficulty": 3, "type": "multiple", "question": "金融行业AI应用的典型场景包括？（多选）", "options": ["A. 智能客服", "B. 风控", "C. 合规审查", "D. 自动交易（无需人工监督）"], "correctAnswer": [0, 1, 2], "explanation": "金融行业典型场景包括智能客服、风控、合规审查。自动交易需要人工监督，不能完全自动化。"}, {"id": "q082", "module": 4, "topic": "4.1", "difficulty": 2, "type": "single", "question": "TDD框架中D代表什么？", "options": ["A. Data", "B. Domain", "C. Design", "D. Deploy"], "correctAnswer": 1, "explanation": "TDD框架：T=Technical（技术可行性），D=Domain（业务领域知识），D=Delivery（交付能力）。"}, {"id": "q083", "module": 4, "topic": "4.5", "difficulty": 3, "type": "single", "question": "政务场景中数据隔离的主要目的是什么？", "options": ["A. 增加成本", "B. 确保不同部门数据不交叉访问", "C. 降低性能", "D. 增加复杂性"], "correctAnswer": 1, "explanation": "数据隔离确保不同部门的数据独立存储和访问，防止数据交叉泄露。"}, {"id": "q084", "module": 4, "topic": "4.7", "difficulty": 3, "type": "single", "question": "医疗AI系统中，患者数据应该如何处理？", "options": ["A. 公开存储", "B. 脱敏处理后使用", "C. 不做任何处理", "D. 只存储不删除"], "correctAnswer": 1, "explanation": "患者数据需要脱敏处理（去除个人身份信息），保护患者隐私。"}, {"id": "q085", "module": 4, "topic": "4.2", "difficulty": 3, "type": "single", "question": "评估一个场景是否适合用Agent解决时，以下哪个因素最不重要？", "options": ["A. 任务的复杂度", "B. 是否需要推理能力", "C. 办公室的装修风格", "D. 预期ROI"], "correctAnswer": 2, "explanation": "办公室装修风格与AI方案适配性无关，任务复杂度、推理需求和ROI才是关键因素。"}, {"id": "q086", "module": 4, "topic": "4.6", "difficulty": 2, "type": "single", "question": "制造业中预测性维护的核心价值是什么？", "options": ["A. 增加维修成本", "B. 通过数据分析预测设备故障时间，减少非计划停机", "C. 延长工作时间", "D. 减少产量"], "correctAnswer": 1, "explanation": "预测性维护通过数据分析预测设备何时可能故障，提前维护，减少非计划停机损失。"}, {"id": "q087", "module": 4, "topic": "4.3", "difficulty": 2, "type": "single", "question": "能力映射的作用是什么？", "options": ["A. 绘制地图", "B. 将业务需求对应到平台具体功能", "C. 管理团队", "D. 设计logo"], "correctAnswer": 1, "explanation": "能力映射将客户的业务需求对应到ADP平台的具体功能模块，确保需求被正确实现。"}, {"id": "q088", "module": 4, "topic": "4.4", "difficulty": 2, "type": "single", "question": "金融AI系统中'人工兜底机制'的含义是什么？", "options": ["A. 完全不需要人工", "B. AI无法处理时转交人工处理", "C. 人工替代AI", "D. 人工做所有工作"], "correctAnswer": 1, "explanation": "人工兜底指AI无法处理或置信度低时，将问题转交人工处理，确保服务质量。"}, {"id": "q089", "module": 4, "topic": "4.5", "difficulty": 2, "type": "single", "question": "政务AI的适老化设计考虑的是什么？", "options": ["A. 只服务年轻人", "B. 考虑老年人使用习惯，如大字体、语音交互等", "C. 增加操作复杂度", "D. 取消线下服务"], "correctAnswer": 1, "explanation": "适老化设计考虑老年人使用习惯，如大字体、简化操作、语音交互、人工辅助等。"}, {"id": "q090", "module": 4, "topic": "4.6", "difficulty": 3, "type": "single", "question": "制造业和零售业AI应用的核心差异是什么？", "options": ["A. 没有差异", "B. 制造业注重准确性和可靠性，零售业注重实时性和个性化", "C. 制造业不需要AI", "D. 零售业不需要准确性"], "correctAnswer": 1, "explanation": "制造业AI注重准确性和可靠性（如质检不能出错），零售业注重实时性和个性化（如推荐要即时）。"}, {"id": "q091", "module": 5, "topic": "5.1", "difficulty": 1, "type": "single", "question": "POC的周期通常是多长？", "options": ["A. 1天", "B. 1-2周", "C. 3个月", "D. 1年"], "correctAnswer": 1, "explanation": "POC周期通常1-2周，用最小成本快速验证方案可行性。"}, {"id": "q092", "module": 5, "topic": "5.2", "difficulty": 1, "type": "single", "question": "效果评测中'忠实度'衡量的是什么？", "options": ["A. 回答是否正确", "B. 回答是否忠于检索到的内容，不编造", "C. 检索速度", "D. 系统稳定性"], "correctAnswer": 1, "explanation": "忠实度衡量回答是否忠于检索到的内容，即模型有没有'自由发挥'编造信息。"}, {"id": "q093", "module": 5, "topic": "5.3", "difficulty": 2, "type": "single", "question": "recall@5衡量的是什么？", "options": ["A. 第5个结果的正确率", "B. 前5个检索结果中包含相关文档的比例", "C. 5秒内的响应率", "D. 5次尝试的成功率"], "correctAnswer": 1, "explanation": "recall@5衡量前5个检索结果中包含相关文档的比例，即'让你找5个，找到了几个对的'。"}, {"id": "q094", "module": 5, "topic": "5.4", "difficulty": 2, "type": "single", "question": "流式输出的主要优势是什么？", "options": ["A. 提高最终准确性", "B. 降低用户感知的首次响应延迟", "C. 减少服务器成本", "D. 增加Token消耗"], "correctAnswer": 1, "explanation": "流式输出逐token返回，用户不用等完整回答，感知的首次响应延迟大幅降低。"}, {"id": "q095", "module": 5, "topic": "5.5", "difficulty": 2, "type": "single", "question": "语义缓存的工作原理是什么？", "options": ["A. 精确匹配问题文本", "B. 计算问题语义相似度，相似问题直接返回缓存结果", "C. 随机返回结果", "D. 不缓存"], "correctAnswer": 1, "explanation": "语义缓存通过计算新问题和已缓存问题的语义相似度，相似度超过阈值时直接返回缓存结果。"}, {"id": "q096", "module": 5, "topic": "5.1", "difficulty": 2, "type": "single", "question": "POC成功标准应该具备什么特点？", "options": ["A. 模糊的描述", "B. 量化的指标", "C. 主观的感受", "D. 不需要标准"], "correctAnswer": 1, "explanation": "POC成功标准应该是量化的指标，如准确率>85%、响应时间<3秒，便于客观判断。"}, {"id": "q097", "module": 5, "topic": "5.6", "difficulty": 2, "type": "single", "question": "Agent行为追踪应该记录什么？", "options": ["A. 只记录最终结果", "B. 每一步决策和工具调用", "C. 不记录", "D. 只记录错误"], "correctAnswer": 1, "explanation": "Agent行为追踪应记录每一步决策和工具调用，便于调试、审计和优化。"}, {"id": "q098", "module": 5, "topic": "5.7", "difficulty": 2, "type": "single", "question": "降级策略的含义是什么？", "options": ["A. 关闭系统", "B. 切换到备用模型或简化流程保证基本服务", "C. 降低产品质量", "D. 解雇员工"], "correctAnswer": 1, "explanation": "降级策略是在主系统出问题时，切换到备用模型或简化流程，保证基本服务可用。"}, {"id": "q099", "module": 5, "topic": "5.4", "difficulty": 3, "type": "single", "question": "KV Cache加速推理的原理是什么？", "options": ["A. 减少模型参数", "B. 缓存已计算的key-value对，避免重复计算", "C. 增加GPU数量", "D. 降低网络延迟"], "correctAnswer": 1, "explanation": "KV Cache缓存之前已计算的key-value对，在生成下一个token时避免重复计算，加速推理。"}, {"id": "q100", "module": 5, "topic": "5.2", "difficulty": 3, "type": "single", "question": "LLM-as-Judge评测方法的特点是什么？", "options": ["A. 使用大模型评估另一个模型的输出质量", "B. 让人工评分", "C. 使用规则匹配", "D. 不评估"], "correctAnswer": 0, "explanation": "LLM-as-Judge使用大模型作为评判者，评估另一个模型输出的质量，效率高但可能有偏差。"}, {"id": "q101", "module": 5, "topic": "5.3", "difficulty": 3, "type": "single", "question": "MRR（Mean Reciprocal Rank）的计算方式是什么？", "options": ["A. 所有相关文档排名的平均值", "B. 第一个相关结果排名倒数的均值", "C. 最后一个相关结果的排名", "D. 检索结果的总数"], "correctAnswer": 1, "explanation": "MRR是第一个相关结果排名倒数的均值。如第一个相关结果排第2，则RR=1/2=0.5。"}, {"id": "q102", "module": 5, "topic": "5.5", "difficulty": 3, "type": "single", "question": "Token成本的计算公式是什么？", "options": ["A. 输入token×单价", "B. 输入token×输入单价+输出token×输出单价", "C. 只计算输出token", "D. 按时间计费"], "correctAnswer": 1, "explanation": "Token成本=输入token×输入单价+输出token×输出单价，通常输出单价高于输入。"}, {"id": "q103", "module": 5, "topic": "5.7", "difficulty": 3, "type": "single", "question": "按请求ID追踪完整链路属于什么排查方法？", "options": ["A. 代码审查", "B. 日志排查", "C. 人工测试", "D. 用户反馈"], "correctAnswer": 1, "explanation": "按请求ID追踪完整调用链路是日志排查的核心方法，可以看到请求在每个环节的处理情况。"}, {"id": "q104", "module": 5, "topic": "5.4", "difficulty": 2, "type": "single", "question": "模型量化INT8的含义是什么？", "options": ["A. 使用8个模型", "B. 将参数精度降低为8位整数", "C. 训练8次", "D. 使用8层网络"], "correctAnswer": 1, "explanation": "INT8量化将模型参数从FP16/FP32降低为8位整数，减少显存占用和计算量，精度损失较小。"}, {"id": "q105", "module": 5, "topic": "5.6", "difficulty": 3, "type": "multiple", "question": "监控仪表盘应该展示哪些核心指标？（多选）", "options": ["A. QPS（每秒查询数）", "B. 延迟", "C. 错误率", "D. Token消耗"], "correctAnswer": [0, 1, 2, 3], "explanation": "监控仪表盘应展示QPS、延迟、错误率、Token消耗等核心指标，全面反映系统状态。"}, {"id": "q106", "module": 6, "topic": "6.1", "difficulty": 1, "type": "single", "question": "数据分类分级中，最高级别通常是？", "options": ["A. 公开", "B. 内部", "C. 机密", "D. 绝密"], "correctAnswer": 3, "explanation": "数据分类分级通常为：公开→内部→机密→绝密，绝密为最高级别。"}, {"id": "q107", "module": 6, "topic": "6.1", "difficulty": 2, "type": "single", "question": "RBAC的含义是什么？", "options": ["A. 基于角色的访问控制", "B. 基于规则的备份策略", "C. 快速数据访问通道", "D. 远程备份和恢复"], "correctAnswer": 0, "explanation": "RBAC = Role-Based Access Control，基于角色的访问控制，不同角色有不同的数据访问权限。"}, {"id": "q108", "module": 6, "topic": "6.2", "difficulty": 1, "type": "single", "question": "Prompt注入攻击的目的是什么？", "options": ["A. 提升系统性能", "B. 绕过安全限制让模型生成不当内容", "C. 帮助系统升级", "D. 改善用户体验"], "correctAnswer": 1, "explanation": "Prompt注入通过精心构造的输入绕过模型的安全限制，诱导模型生成不当内容。"}, {"id": "q109", "module": 6, "topic": "6.3", "difficulty": 2, "type": "single", "question": "最小权限原则的含义是什么？", "options": ["A. 给所有用户最大权限", "B. 只授予完成任务所需的最小权限", "C. 不给任何权限", "D. 权限越大越好"], "correctAnswer": 1, "explanation": "最小权限原则只授予Agent或用户完成任务所需的最小权限，减少越权风险。"}, {"id": "q110", "module": 6, "topic": "6.3", "difficulty": 2, "type": "single", "question": "以下哪个不是缓解模型幻觉的有效策略？", "options": ["A. RAG引入外部知识", "B. 设置置信度阈值", "C. 让模型随意发挥不加约束", "D. 引用溯源"], "correctAnswer": 2, "explanation": "让模型随意发挥不加约束会加剧幻觉。有效策略包括RAG、置信度阈值、引用溯源等。"}, {"id": "q111", "module": 6, "topic": "6.4", "difficulty": 1, "type": "single", "question": "负责任AI的核心原则不包括？", "options": ["A. 公平性", "B. 透明性", "C. 隐蔽性", "D. 安全性"], "correctAnswer": 2, "explanation": "负责任AI原则包括公平性、透明性、隐私性、安全性。隐蔽性与透明性相悖。"}, {"id": "q112", "module": 6, "topic": "6.4", "difficulty": 2, "type": "single", "question": "《生成式人工智能服务管理暂行办法》要求AI生成内容应该？", "options": ["A. 不标注来源", "B. 标注为AI生成", "C. 冒充人工创作", "D. 不需要合规"], "correctAnswer": 1, "explanation": "法规要求标注AI生成内容，让用户知道这是AI生成的而非人工创作。"}, {"id": "q113", "module": 6, "topic": "6.1", "difficulty": 3, "type": "single", "question": "PII保护中，以下哪个不属于PII？", "options": ["A. 手机号", "B. 身份证号", "C. 公司名称", "D. 银行卡号"], "correctAnswer": 2, "explanation": "PII（个人身份信息）包括手机号、身份证号、银行卡号等个人信息。公司名称是公开信息，不属于PII。"}, {"id": "q114", "module": 6, "topic": "6.2", "difficulty": 3, "type": "single", "question": "输出审核策略中，'实时审核'和'异步审核'的区别是什么？", "options": ["A. 没有区别", "B. 实时审核在生成时立即检查，异步审核生成后延迟检查", "C. 实时审核更不准确", "D. 异步审核更快"], "correctAnswer": 1, "explanation": "实时审核在内容生成时立即检查并拦截，异步审核在生成后延迟检查，适用于对延迟不敏感的场景。"}, {"id": "q115", "module": 6, "topic": "6.3", "difficulty": 3, "type": "multiple", "question": "模型幻觉的常见原因包括？（多选）", "options": ["A. 训练数据偏差", "B. 知识截止日期后的信息", "C. 模型过度自信", "D. 充足的上下文信息"], "correctAnswer": [0, 1, 2], "explanation": "幻觉原因包括训练数据偏差（A）、知识截止后信息缺失（B）、模型过度自信（C）。充足上下文（D）有助于减少幻觉。"}, {"id": "q116", "module": 7, "topic": "7.1", "difficulty": 1, "type": "single", "question": "容器与虚拟机的主要区别是什么？", "options": ["A. 容器更慢", "B. 容器共享宿主机内核更轻量，虚拟机有独立操作系统", "C. 没有区别", "D. 虚拟机更轻量"], "correctAnswer": 1, "explanation": "容器共享宿主机内核，更轻量启动更快；虚拟机有独立操作系统，更隔离但更重。"}, {"id": "q117", "module": 7, "topic": "7.1", "difficulty": 2, "type": "single", "question": "Dockerfile的作用是什么？", "options": ["A. 运行容器", "B. 定义镜像构建步骤", "C. 管理网络", "D. 存储数据"], "correctAnswer": 1, "explanation": "Dockerfile定义了镜像的构建步骤，包括基础镜像、依赖安装、代码复制、启动命令等。"}, {"id": "q118", "module": 7, "topic": "7.2", "difficulty": 1, "type": "single", "question": "Kubernetes中Pod是什么？", "options": ["A. 一种数据库", "B. 最小部署单元，包含一个或多个容器", "C. 一种网络协议", "D. 一种存储设备"], "correctAnswer": 1, "explanation": "Pod是K8s中最小的部署单元，包含一个或多个紧密关联的容器。"}, {"id": "q119", "module": 7, "topic": "7.3", "difficulty": 2, "type": "single", "question": "蓝绿部署的核心思想是什么？", "options": ["A. 只有一套环境", "B. 同时维护两套环境，切换流量实现零停机更新", "C. 不更新直接下 function todayStr() { return new Date().toISOString().split('T')[0]; }
function daysBetween(d1, d2) { return Math.floor((new Date(d2) - new Date(d1)) / 86400000); }
function addDays(d, n) { let dt = new Date(d); dt.setDate(dt.getDate()+n); return dt.toISOString().split('T')[0]; }

// ==================== SPACED REPETITION ====================
function updateMastery(topicId, score) {
    let mastery = getMastery();
    if (!mastery[topicId]) mastery[topicId] = {masteryLevel:0, masteryScore:0, totalAttempts:0, correctAttempts:0, lastReviewed:null, nextReview:todayStr(), history:[]};
    let m = mastery[topicId];
    m.totalAttempts++;
    m.lastReviewed = todayStr();
    m.history.push({date:todayStr(), score:score});
    let isSprint = getCurrentWeek() >= 9;
    let intervals = isSprint ? REVIEW_INTERVALS.map(x => Math.max(1, Math.floor(x/2))) : REVIEW_INTERVALS;
    if (score >= 80) { m.masteryLevel = Math.min(5, m.masteryLevel + 1); m.correctAttempts++; }
    else if (score >= 60) { /* maintain */ }
    else { m.masteryLevel = m.masteryLevel === 5 ? 3 : Math.max(0, m.masteryLevel - 2); }
    m.masteryScore = Math.round((m.correctAttempts / m.totalAttempts) * 100);
    m.nextReview = addDays(todayStr(), intervals[m.masteryLevel] || 1);
    saveMastery(mastery);
}
function getDueTopics() {
    let mastery = getMastery();
    let today = todayStr();
    let due = [];
    for (let id in mastery) {
        if (mastery[id].nextReview && mastery[id].nextReview <= today) due.push(id);
    }
    return due;
}
function getCurrentWeek() {
    let prog = getProgress();
    let days = daysBetween(START_DATE, todayStr());
    return Math.min(10, Math.floor(days / 7) + 1);
}
function getCurrentDayInWeek() {
    let days = daysBetween(START_DATE, todayStr());
    return (days % 7) + 1;
}
function getTodayTopics() {
    let w = getCurrentWeek(), d = getCurrentDayInWeek();
    let key = w + '-' + d;
    return SP[key] || [];
}

let currentView = 'dashboard';
document.getElementById('navTabs').addEventListener('click', function(e) {
    let tab = e.target.closest('.nav-tab');
    if (!tab) return;
    let view = tab.dataset.view;
    switchView(view);
});
function switchView(view) {
    currentView = view;
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.toggle('active', t.dataset.view === view));
    document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + view));
    renderView(view);
}
function renderView(view) {
    switch(view) {
        case 'dashboard': renderDashboard(); break;
        case 'learn': renderLearn(); break;
        case 'quiz': renderQuiz(); break;
        case 'exam': renderExam(); break;
        case 'calendar': renderCalendar(); break;
        case 'stats': renderStats(); break;
        case 'resources': renderResources(); break;
        case 'summaries': renderSummaries(); break;
    }
}

function renderDashboard() {
    let prog = getProgress();
    let mastery = getMastery();
    let today = todayStr();
    let daysToExam = daysBetween(today, EXAM_DATE);
    document.getElementById('examCountdown').textContent = '距离考试: ' + Math.max(0, daysToExam) + '天';
    // Check missed days
    handleMissedDays();
    // Calculate stats
    let totalKP = KP.length;
    let studiedKP = Object.keys(mastery).filter(k => mastery[k].totalAttempts > 0).length;
    let overallPct = totalKP > 0 ? Math.round((studiedKP / totalKP) * 100) : 0;
    let todayDone = prog.days[today] && prog.days[today].completed;
    // Module mastery
    let moduleMastery = {};
    for (let i = 1; i <= 7; i++) {
        let kps = KP.filter(k => k.module === i);
        let scores = kps.map(k => mastery[k.id] ? mastery[k.id].masteryScore : 0);
        moduleMastery[i] = scores.length > 0 ? Math.round(scores.reduce((a,b)=>a+b,0) / scores.length) : 0;
    }
    // Today's topics
    let todayTopics = getTodayTopics();
    let topicNames = todayTopics.map(tid => {
        let kp = KP.find(k => k.id === tid);
        return kp ? kp.id + ' ' + kp.title : tid;
    });
    // Due topics
    let dueTopics = getDueTopics();
    let dueNames = dueTopics.slice(0, 5).map(tid => {
        let kp = KP.find(k => k.id === tid);
        let m = mastery[tid];
        let overdue = m && m.nextReview ? daysBetween(m.nextReview, today) : 0;
        return (kp ? kp.id + ' ' + kp.title : tid) + (overdue > 0 ? ' (逾期' + overdue + '天)' : '');
    });
    // Score trend (last 7 days)
    let qh = getQuizHistory();
    let recentScores = [];
    for (let i = 6; i >= 0; i--) {
        let d = addDays(today, -i);
        let session = qh.sessions.find(s => s.date === d);
        recentScores.push({date: d, score: session ? session.score : null});
    }
    // Exam readiness
    let readiness = Math.round(overallPct * 0.6 + Object.values(moduleMastery).reduce((a,b)=>a+b,0) / 7 * 0.4);

    html += '</div>';
    // Module mastery
    html += '<div class="card"><div class="card-title">各模块掌握度</div>';

        let pct = moduleMastery[i];
        html += '<div class="module-bar"><div class="bar-label">' + MODULE_NAMES[i] + '</div><div class="bar-bg"><div class="bar-fill" style="width:' + pct + '%;background:' + MODULE_COLORS[i-1] + '">' + (pct > 15 ? pct + '%' : '') + '</div></div><div class="bar-pct">' + pct + '%</div></div>';
    }
    html += '</div>';
    // Today's plan
    html += '<div class="card"><div class="card-title">今日学习计划 (第' + getCurrentWeek() + '周 第' + getCurrentDayInWeek() + '天)</div>';
    if (topicNames.length > 0) {
        html += '<div class="mb-8" style="font-size:14px;color:var(--text2)">知识点: ' + topicNames.join(', ') + '</div>';
        html += '<div class="flex gap-8"><button class="btn btn-primary" onclick="switchView(\'learn\')">开始学习</button><button class="btn btn-success" onclick="switchView(\'quiz\')">开始测验</button></div>';
    } else {
        html += '<div style="color:var(--text3)">今日为复习/模拟考日</div>';
    }
    html += '</div>';
    // Score trend
    html += '<div class="card"><div class="card-title">近7天得分趋势</div><div class="chart-container"><canvas id="trendChart" height="120"></canvas></div></div>';
    // Due topics
    if (dueNames.length > 0) {
        html += '<div class="card"><div class="card-title" style="color:var(--warning)">需要复习的主题</div>';

        html += '</div>';

function drawTrendChart(scores) {
    let canvas = document.getElementById('trendChart');
    if (!canvas) return;
    let ctx = canvas.getContext('2d');
    let w = canvas.parentElement.clientWidth;
    canvas.width = w; canvas.height = 120;
    ctx.clearRect(0, 0, w, 120);
    let validScores = scores.filter(s => s.score !== null);
    if (validScores.length === 0) {
        ctx.fillStyle = '#86909C'; ctx.font = '13px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('暂无测验数据', w/2, 60); return;
    }
    let pad = 30, gw = w - pad*2, gh = 80;
    // Grid
    ctx.strokeStyle = '#E5E6EB'; ctx.lineWidth = 0.5;
    for (let i = 0; i <= 4; i++) { let y = pad + gh - (gh * i / 4); ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(w-pad, y); ctx.stroke(); }
    // Labels
    ctx.fillStyle = '#86909C'; ctx.font = '10px sans-serif'; ctx.textAlign = 'right';
    for (let i = 0; i <= 4; i++) { ctx.fillText((i*25)+'', pad-5, pad+gh-(gh*i/4)+3); }
    // Line
    let pts = [];
    scores.forEach((s, i) => {
        if (s.score !== null) {
            let x = pad + (gw * i / (scores.length - 1 || 1));
            let y = pad + gh - (gh * s.score / 100);
            pts.push({x, y, score: s.score, date: s.date});
        }
    });
    if (pts.length > 1) {
        ctx.strokeStyle = '#0052D9'; ctx.lineWidth = 2; ctx.beginPath();
        pts.forEach((p, i) => { i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y); });
        ctx.stroke();
    }
    pts.forEach(p => {
        ctx.fillStyle = '#0052D9'; ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#1D2129'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(p.score + '', p.x, p.y - 10);
    });
}

function handleMissedDays() {
    let prog = getProgress();
    if (!prog.lastStudyDate) return;
    let last = prog.lastStudyDate;
    let today = todayStr();
    let missed = daysBetween(last, today) - 1;

        if (!prog.days[d]) prog.days[d] = {completed: false, missed: true, topicsStudied: [], quizScore: 0};
    }
    prog.currentStreak = 0;
    saveProgress(prog);
}

function toggleStar(id) { let n = getNotes(); if (!n[id]) n[id] = {text:'',marked:false,starred:false,lastModified:todayStr()}; n[id].starred = !n[id].starred; saveNotes(n); renderLearn(); }
function autoSaveNote(id) { let n = getNotes(); if (!n[id]) n[id] = {text:'',marked:false,starred:false,lastModified:todayStr()}; n[id].text = document.getElementById('noteArea').value; n[id].lastModified = todayStr(); saveNotes(n); }
function markStudied(id) {

function generateTFQuestions(kp) {
    let questions = [];

    let topicQs = QB.filter(q => q.topic === kp.id && q.type === 'single');
    topicQs.slice(0, 3).forEach(q => {

function startQuiz() {
    let questions = selectQuizQuestions();

}
function selectQuizQuestions() {
    let todayTopics = getTodayTopics();
    let dueTopics = getDueTopics();
    let mastery = getMastery();
    let weakTopics = KP.filter(k => mastery[k.id] && mastery[k.id].masteryScore < 60).map(k => k.id);
    let selected = [];
    // 50% from today's topics
    let todayQs = QB.filter(q => todayTopics.includes(q.topic));
    shuffleArray(todayQs);
    selected.push(...todayQs.slice(0, 5));
    // 30% from due topics
    let dueQs = QB.filter(q => dueTopics.includes(q.topic) && !selected.find(s => s.id === q.id));
    shuffleArray(dueQs);
    selected.push(...dueQs.slice(0, 3));
    // 20% from weak topics
    let weakQs = QB.filter(q => weakTopics.includes(q.topic) && !selected.find(s => s.id === q.id));
    shuffleArray(weakQs);
    selected.push(...weakQs.slice(0, 2));
    // Fill remaining from all
    if (selected.length < 10) {
        let remaining = QB.filter(q => !selected.find(s => s.id === q.id));
        shuffleArray(remaining);
        selected.push(...remaining.slice(0, 10 - selected.length));
    }
    return selected.slice(0, 10);
}
function shuffleArray(arr) { for (let i = arr.length - 1; i > 0; i--) { let j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } }
function renderQuizQuestion() {
    if (!quizState || !quizState.active) return;
    let q = quizState.questions[quizState.current];
    let total = quizState.questions.length;
    let cur = quizState.current + 1;
    let isMultiple = q.type === 'multiple';
    let html = '<div class="card">';
    html += '<div class="quiz-progress"><span style="font-size:13px;color:var(--text2)">' + cur + '/' + total + '</span><div class="qp-bar"><div class="qp-fill" style="width:' + (cur/total*100) + '%"></div></div>';
    html += '<span class="badge ' + (isMultiple ? 'badge-warning' : 'badge-primary') + '">' + (isMultiple ? '多选' : '单选') + '</span></div>';
    html += '<div class="quiz-question"><div class="q-text">' + cur + '. ' + q.question + '</div>';
    let answered = quizState.answers[quizState.current];
    let submitted = answered && answered.submitted;
    q.options.forEach((opt, i) => {
        let cls = 'quiz-option';
        if (submitted) {
            if (isMultiple) {
                if (q.correctAnswer.includes(i)) cls += ' correct';
                else if (answered.selected && answered.selected.includes(i)) cls += ' wrong';
            } else {
                if (i === q.correctAnswer) cls += ' correct';
                else if (i === answered.selected) cls += ' wrong';
            }
        } else {
            if (isMultiple) { if (answered && answered.selected && answered.selected.includes(i)) cls += ' selected'; }
            else { if (answered && answered.selected === i) cls += ' selected'; }
        }
        html += '<div class="' + cls + '" onclick="selectQuizOption(' + i + ',' + isMultiple + ')">' + opt + '</div>';
    });
    if (submitted) {
        let isCorrect = isMultiple ? arraysEqual(answered.selected.sort(), q.correctAnswer.slice().sort()) : answered.selected === q.correctAnswer;
        html += '<div class="quiz-explanation"><strong>' + (isCorrect ? '回答正确!' : '回答错误') + '</strong><br>' + q.explanation + '</div>';
        html += '<div class="mt-16 flex gap-8"><button class="btn btn-primary" onclick="nextQuizQuestion()">' + (cur < total ? '下一题' : '查看结果') + '</button></div>';
    } else {
        html += '<div class="mt-16"><button class="btn btn-primary" onclick="submitQuizAnswer()">提交答案</button></div>';
    }
    html += '</div></div>';
    document.getElementById('view-quiz').innerHTML = html;
}
function arraysEqual(a, b) { if (a.length !== b.length) return false; for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false; return true; }
function selectQuizOption(idx, isMultiple) {
    if (!quizState) return;
    let answered = quizState.answers[quizState.current];
    if (answered && answered.submitted) return;
    if (!quizState.answers[quizState.current]) quizState.answers[quizState.current] = {selected: isMultiple ? [] : null, submitted: false};
    let a = quizState.answers[quizState.current];
    if (isMultiple) {
        if (!a.selected) a.selected = [];
        let i = a.selected.indexOf(idx);
        if (i >= 0) a.selected.splice(i, 1); else a.selected.push(idx);
    } else {
        a.selected = idx;
    }
    renderQuizQuestion();
}
function submitQuizAnswer() {
    let a = quizState.answers[quizState.current];
    if (!a || (a.selected === null || (Array.isArray(a.selected) && a.selected.length === 0))) { alert('请选择答案'); return; }
    a.submitted = true;
    let q = quizState.questions[quizState.current];
    let isCorrect = q.type === 'multiple' ? arraysEqual(a.selected.sort(), q.correctAnswer.slice().sort()) : a.selected === q.correctAnswer;
    // Update mastery
    updateMastery(q.topic, isCorrect ? 100 : 0);
    renderQuizQuestion();
}
function nextQuizQuestion() {
    if (quizState.current < quizState.questions.length - 1) {
        quizState.current++;
        renderQuizQuestion();
    } else {
        finishQuiz();
    }
}
function finishQuiz() {
    let correct = 0;
    quizState.questions.forEach((q, i) => {
        let a = quizState.answers[i];
        if (!a) return;
        if (q.type === 'multiple') { if (arraysEqual(a.selected.sort(), q.correctAnswer.slice().sort())) correct++; }
        else { if (a.selected === q.correctAnswer) correct++; }
    });
    let score = Math.round((correct / quizState.questions.length) * 100);
    let duration = Math.round((Date.now() - quizState.startTime) / 1000);
    // Save to history
    let qh = getQuizHistory();
    qh.sessions.push({id: 'q' + Date.now(), date: todayStr(), questions: quizState.questions.map(q=>q.id), answers: quizState.answers, correct: correct, score: score, duration: duration, type: 'daily'});
    saveQuizHistory(qh);
    // Update progress
    let prog = getProgress();
    let today = todayStr();
    if (!prog.days[today]) prog.days[today] = {completed:false,studyMinutes:0,topicsStudied:[],quizScore:0};
    prog.days[today].quizScore = score;
    prog.days[today].completed = true;
    prog.days[today].studyMinutes += Math.round(duration / 60);
    saveProgress(prog);
    // Show result
    quizState.active = false;
    let html = '<div class="card quiz-result">';
    html += '<div class="score">' + score + '分</div>';
    html += '<div style="font-size:16px;color:var(--text2);margin:8px 0">答对 ' + correct + '/' + quizState.questions.length + ' 题</div>';
    html += '<div style="font-size:14px;color:var(--text3)">用时: ' + Math.round(duration/60) + ' 分钟</div>';
    // Per-topic breakdown
    let topicResults = {};
    quizState.questions.forEach((q, i) => {
        let a = quizState.answers[i];
        if (!topicResults[q.topic]) topicResults[q.topic] = {correct:0, total:0};
        topicResults[q.topic].total++;
        let isC = q.type === 'multiple' ? arraysEqual(a.selected.sort(), q.correctAnswer.slice().sort()) : a.selected === q.correctAnswer;
        if (isC) topicResults[q.topic].correct++;
    });
    html += '<div style="text-align:left;max-width:400px;margin:16px auto"><div class="card-title">各主题表现</div>';
    for (let tid in topicResults) {
        let r = topicResults[tid];
        let pct = Math.round(r.correct / r.total * 100);
        let kp = KP.find(k => k.id === tid);
        html += '<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px"><span>' + (kp ? kp.id + ' ' + kp.title : tid) + '</span><span style="color:' + (pct >= 80 ? 'var(--success)' : 'var(--error)') + '">' + r.correct + '/' + r.total + '</span></div>';
    }
    html += '</div>';
    html += '<div class="mt-16 flex gap-8" style="justify-content:center"><button class="btn btn-primary" onclick="quizState=null;renderQuiz()">返回</button><button class="btn btn-outline" onclick="quizState=null;switchView(\'learn\')">去复习</button></div>';
    html += '</div>';
    document.getElementById('view-quiz').innerHTML = html;
}

            html += '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px"><span>' + s.date + '</span><span>得分: <strong style="color:' + (s.score >= 60 ? 'var(--success)' : 'var(--error)') + '">' + s.score + '分</strong></span><span>' + (s.score >= 60 ? '通过' : '未通过') + '</span></div>';
        });
        html += '</div>';
    }
    html += '</div></div>';
    document.getElementById('view-exam').innerHTML = html;
}
function startExam() {
    if (!confirm('确定开始模拟考试？考试时间90分钟，共60题。')) return;
    let questions = selectExamQuestions();
    examState = {active: true, questions: questions, answers: new Array(60).fill(null), flags: new Array(60).fill(false), current: 0, startTime: Date.now(), duration: 90*60*1000};
    examTimer = setInterval(examTick, 1000);
    renderExamQuestion();
}
function selectExamQuestions() {
    let selected = [];
    let moduleCounts = {1:8, 2:12, 3:10, 4:14, 5:8, 6:4, 7:4}; // total 60
    for (let mod in moduleCounts) {
        let modQs = QB.filter(q => q.module === parseInt(mod));
        shuffleArray(modQs);
        selected.push(...modQs.slice(0, moduleCounts[mod]));
    }
    shuffleArray(selected);
    return selected.slice(0, 60);
}
function examTick() {
    if (!examState || !examState.active) return;
    let elapsed = Date.now() - examState.startTime;
    let remaining = examState.duration - elapsed;
    if (remaining <= 0) { finishExam(); return; }
    let timerEl = document.getElementById('examTimerDisplay');
    if (timerEl) {
        let min = Math.floor(remaining / 60000);
        let sec = Math.floor((remaining % 60000) / 1000);
        timerEl.textContent = min + ':' + (sec < 10 ? '0' : '') + sec;
        if (remaining < 300000) timerEl.parentElement.classList.add('warning');
    }
}
function renderExamQuestion() {
    if (!examState || !examState.active) return;
    let q = examState.questions[examState.current];
    let isMultiple = q.type === 'multiple';
    let elapsed = Date.now() - examState.startTime;
    let remaining = examState.duration - elapsed;
    let min = Math.floor(remaining / 60000);
    let sec = Math.floor((remaining % 60000) / 1000);
    let html = '<div class="exam-layout"><div>';
    html += '<div class="card"><div class="exam-timer" id="examTimerDisplay">' + min + ':' + (sec < 10 ? '0' : '') + sec + '</div>';
    html += '<div class="flex-between mb-16"><span style="font-size:13px;color:var(--text2)">第 ' + (examState.current+1) + '/60 题</span>';
    html += '<button class="flag-btn ' + (examState.flags[examState.current] ? 'flagged' : '') + '" onclick="toggleFlag(' + examState.current + ')">' + (examState.flags[examState.current] ? '已标记' : '标记') + '</button></div>';
    html += '<div class="q-text" style="font-size:15px;margin-bottom:16px">' + (examState.current+1) + '. ' + q.question + '</div>';
    let ans = examState.answers[examState.current];
    q.options.forEach((opt, i) => {
        let cls = 'quiz-option';
        if (isMultiple) { if (ans && ans.includes(i)) cls += ' selected'; }
        else { if (ans === i) cls += ' selected'; }
        html += '<div class="' + cls + '" onclick="selectExamOption(' + i + ',' + isMultiple + ')">' + opt + '</div>';
    });
    html += '<div class="mt-16 flex gap-8">';
    if (examState.current > 0) html += '<button class="btn btn-outline" onclick="examState.current--;renderExamQuestion()">上一题</button>';
    if (examState.current < 59) html += '<button class="btn btn-primary" onclick="examState.current++;renderExamQuestion()">下一题</button>';
    else html += '<button class="btn btn-success" onclick="finishExam()">交卷</button>';
    html += '</div></div></div>';
    // Navigation panel
    html += '<div class="exam-nav-panel"><div style="font-size:13px;color:var(--text2);margin-bottom:8px">题目导航</div><div>';
    for (let i = 0; i < 60; i++) {
        let cls = 'q-num';
        if (i === examState.current) cls += ' current';
        else if (examState.flags[i]) cls += ' flagged';
        else if (examState.answers[i] !== null) cls += ' answered';
        html += '<span class="' + cls + '" onclick="examState.current=' + i + ';renderExamQuestion()">' + (i+1) + '</span>';
    }
    let answeredCount = examState.answers.filter(a => a !== null).length;
    html += '</div><div style="margin-top:12px;font-size:12px;color:var(--text3)">已答: ' + answeredCount + '/60</div>';
    html += '<button class="btn btn-success btn-sm mt-8" onclick="finishExam()" style="width:100%">交卷</button>';
    html += '</div></div>';
    document.getElementById('view-exam').innerHTML = html;
}
function selectExamOption(idx, isMultiple) {
    if (!examState) return;
    let cur = examState.current;
    if (isMultiple) {
        if (!examState.answers[cur]) examState.answers[cur] = [];
        let i = examState.answers[cur].indexOf(idx);
        if (i >= 0) examState.answers[cur].splice(i, 1); else examState.answers[cur].push(idx);
        if (examState.answers[cur].length === 0) examState.answers[cur] = null;
    } else {
        examState.answers[cur] = idx;
    }
    renderExamQuestion();
}
function toggleFlag(idx) { examState.flags[idx] = !examState.flags[idx]; renderExamQuestion(); }
function finishExam() {
    if (!confirm('确定交卷？')) return;
    clearInterval(examTimer);
    let correct = 0;
    let moduleCorrect = {};
    examState.questions.forEach((q, i) => {
        let a = examState.answers[i];
        if (!moduleCorrect[q.module]) moduleCorrect[q.module] = {correct:0, total:0};
        moduleCorrect[q.module].total++;
        let isC = false;
        if (q.type === 'multiple') { isC = a && Array.isArray(a) && arraysEqual(a.sort(), q.correctAnswer.slice().sort()); }
        else { isC = a === q.correctAnswer; }
        if (isC) { correct++; moduleCorrect[q.module].correct++; }
    });
    let score = Math.round((correct / 60) * 100);
    let duration = Math.round((Date.now() - examState.startTime) / 1000);
    // Save
    let qh = getQuizHistory();
    qh.sessions.push({id:'m'+Date.now(), date:todayStr(), questions:examState.questions.map(q=>q.id), answers:examState.answers, correct:correct, score:score, duration:duration, type:'mock'});
    saveQuizHistory(qh);
    // Update mastery for all topics
    examState.questions.forEach((q, i) => {
        let a = examState.answers[i];
        let isC = q.type === 'multiple' ? (a && Array.isArray(a) && arraysEqual(a.sort(), q.correctAnswer.slice().sort())) : a === q.correctAnswer;
        updateMastery(q.topic, isC ? 100 : 0);
    });
    examState.active = false;
    // Show results
    let html = '<div class="card quiz-result">';
    html += '<div class="score" style="color:' + (score >= 60 ? 'var(--success)' : 'var(--error)') + '">' + score + '分</div>';
    html += '<div style="font-size:18px;margin:8px 0">' + (score >= 60 ? '恭喜通过!' : '未通过，继续加油!') + '</div>';
    html += '<div style="font-size:14px;color:var(--text2)">答对 ' + correct + '/60 题 | 用时: ' + Math.round(duration/60) + ' 分钟</div>';
    // Module breakdown
    html += '<div style="text-align:left;max-width:500px;margin:20px auto"><div class="card-title">各模块得分</div>';
    for (let mod = 1; mod <= 7; mod++) {
        let mc = moduleCorrect[mod] || {correct:0, total:0};
        let pct = mc.total > 0 ? Math.round(mc.correct / mc.total * 100) : 0;
        html += '<div class="module-bar"><div class="bar-label">' + MODULE_NAMES[mod] + '</div><div class="bar-bg"><div class="bar-fill" style="width:' + pct + '%;background:' + MODULE_COLORS[mod-1] + '">' + (pct > 15 ? pct + '%' : '') + '</div></div><div class="bar-pct">' + mc.correct + '/' + mc.total + '</div></div>';
    }
    html += '</div>';
    // Wrong answers review
    html += '<div style="text-align:left;max-width:600px;margin:16px auto"><div class="card-title">错题回顾</div>';
    examState.questions.forEach((q, i) => {
        let a = examState.answers[i];
        let isC = q.type === 'multiple' ? (a && Array.isArray(a) && arraysEqual(a.sort(), q.correctAnswer.slice().sort())) : a === q.correctAnswer;
        if (!isC) {
            html += '<div style="padding:12px;margin-bottom:8px;background:var(--error-light);border-radius:6px;font-size:13px">';
            html += '<strong>第' + (i+1) + '题:</strong> ' + q.question + '<br>';
            html += '<span style="color:var(--error)">你的答案: ' + (a !== null ? (Array.isArray(a) ? a.map(x=>q.options[x]).join(', ') : q.options[a]) : '未作答') + '</span><br>';
            html += '<span style="color:var(--success)">正确答案: ' + q.correctAnswer.map(x=>q.options[x]).join(', ') + '</span><br>';
            html += '<span style="color:var(--text3)">' + q.explanation + '</span>';
            html += '</div>';
        }
    });
    html += '</div>';
    html += '<button class="btn btn-primary mt-16" onclick="examState=null;renderExam()">返回</button>';
    html += '</div>';
    document.getElementById('view-exam').innerHTML = html;
}

function drawScoreTrendChart() {
    let canvas = document.getElementById('scoreTrendChart');
    if (!canvas) return;
    let ctx = canvas.getContext('2d');
    let w = canvas.parentElement.clientWidth;
    canvas.width = w; canvas.height = 200;
    let qh = getQuizHistory();
    let today = todayStr();
    let data = [];
    for (let i = 13; i >= 0; i--) {
        let d = addDays(today, -i);
        let sessions = qh.sessions.filter(s => s.date === d);
        let avg = sessions.length > 0 ? Math.round(sessions.reduce((s, sess) => s + sess.score, 0) / sessions.length) : null;
        data.push({date: d, score: avg});
    }
    let pad = 40, gw = w - pad*2, gh = 140;
    ctx.clearRect(0, 0, w, 200);
    // Grid
    ctx.strokeStyle = '#E5E6EB'; ctx.lineWidth = 0.5;
    for (let i = 0; i <= 4; i++) { let y = pad + gh - (gh*i/4); ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(w-pad, y); ctx.stroke(); ctx.fillStyle='#86909C'; ctx.font='10px sans-serif'; ctx.textAlign='right'; ctx.fillText((i*25)+'', pad-5, y+3); }
    let validPts = data.filter(d => d.score !== null);
    if (validPts.length === 0) { ctx.fillStyle='#86909C'; ctx.font='13px sans-serif'; ctx.textAlign='center'; ctx.fillText('暂无数据', w/2, 100); return; }
    // Line
    ctx.strokeStyle = '#0052D9'; ctx.lineWidth = 2; ctx.beginPath();
    let started = false;
    data.forEach((d, i) => {
        if (d.score !== null) {
            let x = pad + (gw * i / 13);
            let y = pad + gh - (gh * d.score / 100);
            if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
        }
    });
    ctx.stroke();
    // Points
    data.forEach((d, i) => {
        if (d.score !== null) {
            let x = pad + (gw * i / 13);
            let y = pad + gh - (gh * d.score / 100);
            ctx.fillStyle = d.score >= 80 ? '#00A870' : d.score >= 60 ? '#FAAD14' : '#E34D59';
            ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#1D2129'; ctx.font = '9px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText(d.score+'', x, y-10);
        }
    });
}
function drawRadarChart(values) {
    let canvas = document.getElementById('radarChart');
    if (!canvas) return;
    let ctx = canvas.getContext('2d');
    let w = canvas.parentElement.clientWidth;
    canvas.width = w; canvas.height = 200;
    let cx = w/2, cy = 100, r = 70;
    let n = 7;
    ctx.clearRect(0, 0, w, 200);
    // Grid
    for (let level = 1; level <= 4; level++) {
        ctx.strokeStyle = '#E5E6EB'; ctx.lineWidth = 0.5; ctx.beginPath();
        for (let i = 0; i <= n; i++) {
            let angle = (Math.PI * 2 * i / n) - Math.PI / 2;
            let x = cx + Math.cos(angle) * r * level / 4;
            let y = cy + Math.sin(angle) * r * level / 4;
            i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.stroke();
    }
    // Axes
    for (let i = 0; i < n; i++) {
        let angle = (Math.PI * 2 * i / n) - Math.PI / 2;
        ctx.strokeStyle = '#E5E6EB'; ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(angle) * r, cy + Math.sin(angle) * r);
        ctx.stroke();
        // Labels
        let lx = cx + Math.cos(angle) * (r + 15);
        let ly = cy + Math.sin(angle) * (r + 15);
        ctx.fillStyle = '#4E5969'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(MODULE_NAMES[i+1].substring(0, 4), lx, ly + 3);
    }
    // Data
    ctx.fillStyle = 'rgba(0,82,217,0.2)'; ctx.strokeStyle = '#0052D9'; ctx.lineWidth = 2; ctx.beginPath();
    for (let i = 0; i <= n; i++) {
        let idx = i % n;
        let angle = (Math.PI * 2 * idx / n) - Math.PI / 2;
        let val = values[idx] / 100;
        let x = cx + Math.cos(angle) * r * val;
        let y = cy + Math.sin(angle) * r * val;
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.fill(); ctx.stroke();
    // Points
    for (let i = 0; i < n; i++) {
        let angle = (Math.PI * 2 * i / n) - Math.PI / 2;
        let val = values[i] / 100;
        let x = cx + Math.cos(angle) * r * val;
        let y = cy + Math.sin(angle) * r * val;
        ctx.fillStyle = '#0052D9'; ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI*2); ctx.fill();
    }
}
function drawHeatmap() {
    let container = document.getElementById('knowledgeHeatmap');
    if (!container) return;
    let mastery = getMastery();
    let html = '';
    KP.forEach(kp => {
        let m = mastery[kp.id];
        let score = m ? m.masteryScore : 0;
        let level = m ? m.masteryLevel : 0;
        let bg;
        if (level === 0) bg = '#E5E6EB';
        else if (level === 1) bg = '#FDE8EA';
        else if (level === 2) bg = '#FFF7E6';
        else if (level === 3) bg = '#E8F8F0';
        else if (level === 4) bg = '#52C41A';
        else bg = '#00A870';
        let color = level >= 4 ? '#fff' : '#1D2129';
        html += '<div style="background:' + bg + ';color:' + color + ';padding:6px 4px;border-radius:4px;text-align:center;font-size:10px;cursor:pointer;min-height:40px;display:flex;align-items:center;justify-content:center" title="' + kp.title + ' (' + score + '%)" onclick="selectedKP=\'' + kp.id + '\';switchView(\'learn\')">' + kp.id + '</div>';
    });
    container.innerHTML = html;
}
function drawTimeDistChart() {
    let canvas = document.getElementById('timeDistChart');
    if (!canvas) return;
    let ctx = canvas.getContext('2d');
    let w = canvas.parentElement.clientWidth;
    canvas.width = w; canvas.height = 200;
    let prog = getProgress();
    let moduleTime = [0,0,0,0,0,0,0,0];
    for (let date in prog.days) {
        let d = prog.days[date];
        if (d.topicsStudied) {
            d.topicsStudied.forEach(tid => {
                let kp = KP.find(k => k.id === tid);
                if (kp) moduleTime[kp.module] += (d.studyMinutes || 15) / d.topicsStudied.length;
            });
        }
    }
    let total = moduleTime.reduce((a,b) => a+b, 0) || 1;
    ctx.clearRect(0, 0, w, 200);
    let pad = 40, barW = (w - pad*2) / 7 - 8;
    for (let i = 1; i <= 7; i++) {
        let x = pad + (i-1) * ((w-pad*2)/7) + 4;
        let h = (moduleTime[i] / total) * 130;
        let y = 170 - h;
        ctx.fillStyle = MODULE_COLORS[i-1];
        ctx.fillRect(x, y, barW, h);
        ctx.fillStyle = '#4E5969'; ctx.font = '9px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(MODULE_NAMES[i].substring(0,4), x + barW/2, 185);
        if (h > 15) { ctx.fillStyle = '#fff'; ctx.fillText(Math.round(moduleTime[i]) + '分', x + barW/2, y + 12); }
    }
}
function drawGaugeChart() {
    let canvas = document.getElementById('gaugeChart');
    if (!canvas) return;
    let ctx = canvas.getContext('2d');
    let w = canvas.parentElement.clientWidth;
    canvas.width = w; canvas.height = 200;
    let mastery = getMastery();
    let totalKP = KP.length;
    let studiedKP = Object.keys(mastery).filter(k => mastery[k].totalAttempts > 0).length;
    let overallPct = Math.round((studiedKP / totalKP) * 100);
    let avgMastery = Object.values(mastery).length > 0 ? Math.round(Object.values(mastery).reduce((s,m) => s + m.masteryScore, 0) / Object.values(mastery).length) : 0;
    let readiness = Math.round((overallPct + avgMastery) / 2);
    let cx = w/2, cy = 130, r = 80;
    ctx.clearRect(0, 0, w, 200);
    // Background arc
    ctx.strokeStyle = '#E5E6EB'; ctx.lineWidth = 12; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(cx, cy, r, Math.PI, 0); ctx.stroke();
    // Value arc
    let angle = Math.PI + (Math.PI * readiness / 100);
    ctx.strokeStyle = readiness >= 80 ? '#00A870' : readiness >= 60 ? '#FAAD14' : '#E34D59';
    ctx.lineWidth = 12; ctx.beginPath(); ctx.arc(cx, cy, r, Math.PI, angle); ctx.stroke();
    // Text
    ctx.fillStyle = '#1D2129'; ctx.font = 'bold 28px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(readiness + '', cx, cy - 10);
    ctx.fillStyle = '#86909C'; ctx.font = '12px sans-serif';
    ctx.fillText('准备度', cx, cy + 10);
    ctx.fillText('通过率: ' + Math.min(99, Math.round(readiness * 1.1)) + '%', cx, cy + 28);
}

    {id:'fde-guide',title:'FDE前沿部署工程师指南',category:'官方认证',type:'external',url:'https://adp.tencent.com/zh/blog/adp-fde-certification-guide',description:'腾讯云ADP FDE认证官方指南，包含考试说明、知识框架和备考建议。',content:'<h3>认证概述</h3><p>腾讯云ADP前沿部署工程师（FDE）认证是面向AI时代技术人员的专业技术认证。FDE概念源自Palantir，指驻扎在客户现场、兼具工程能力与业务理解力的技术角色。</p><h3>考试信息</h3><ul><li>考试形式：Prometric线下闭卷机考</li><li>题目数量：60题（40单选+20多选）</li><li>考试时长：90分钟</li><li>合格标准：100分满分，70分合格</li><li>考试费用：1200元</li><li>证书有效期：2年</li></ul><h3>知识模块</h3><ol><li>AI与生成式AI基础（10-15%）</li><li>ADP核心功能与应用搭建（18-22%）</li><li>智能体开发（15-18%）</li><li>场景理解与方案设计（20-25%）</li><li>交付实施·评测与运维（10-15%）</li><li>安全合规与责任AI（贯穿各模块）</li><li>云原生与部署基础（8-12%）</li></ol><h3>备考建议</h3><p>建议按照本系统的10周学习计划循序渐进，重点掌握场景理解与方案设计模块（权重最高），同时注意间隔重复巩固已学知识。</p>'},

    {id:'adp-official-doc',title:'腾讯云ADP官方文档',category:'官方文档',type:'external',url:'https://cloud.tencent.com/document/product/adx',description:'ADP平台完整技术文档，包含API参考、开发指南和最佳实践。',content:'<h3>平台概述</h3><p>腾讯云ADP（Application Development Platform）是面向企业的AI应用开发平台，定位为"让企业快速构建AI原生应用"。</p><h3>核心功能</h3><h4>1. 模型服务</h4><p>支持接入混元、DeepSeek、ChatGLM、Llama等多家模型提供商，提供智能路由和成本优化策略。</p><h4>2. 知识库系统</h4><p>支持PDF、Word、Excel、Markdown等多种文档格式，提供固定分块、语义分块、递归分块三种策略，支持Chunk Overlap防止信息丢失。</p><h4>3. 工作流引擎</h4><p>支持LLM节点、条件节点、代码节点、HTTP节点、知识检索节点等多种节点类型，支持分支合并、并行执行、循环结构和子工作流。</p><h4>4. Agent框架</h4><p>支持单Agent、工作流Agent和Multi-Agent三种应用类型，提供系统提示词设计、工具调用、MCP协议等能力。</p><h3>企业级特性</h3><ul><li>权限管理（RBAC）</li><li>审计日志</li><li>多租户隔离</li><li>私有化部署</li><li>监控告警</li></ul>'},
    {id:'adp-fde-learning',title:'FDE官方学习中心',category:'官方文档',type:'external',url:'https://cloud.tencent.com/product/adx',description:'腾讯云ADP FDE官方学习资源，包含教程、视频和实操指南。',content:'<h3>学习路径</h3><p>官方学习中心提供了从入门到进阶的完整学习路径：</p><h4>入门阶段</h4><ul><li>AI与大模型基础概念</li><li>FDE角色定位与职责</li><li>ADP平台基本操作</li></ul><h4>进阶阶段</h4><ul><li>RAG系统设计与优化</li><li>Agent开发与工具调用</li><li>工作流编排实战</li><li>Multi-Agent架构设计</li></ul><h4>高级阶段</h4><ul><li>行业解决方案设计</li><li>性能优化与成本控制</li><li>安全合规与责任AI</li><li>云原生部署实践</li></ul><h3>学习资源</h3><p>官方提供视频教程、实操实验室、案例库和认证模拟题等多种学习资源，建议结合本系统进行系统学习。</p>'},
    {id:'fde-learning-path',title:'FDE学习路线图',category:'学习指南',type:'external',url:'http://lib.uml.com.cn/ebook/FDE/learning-path.asp',description:'系统化的FDE学习路线图，包含各阶段学习目标和推荐资源。',content:'<h3>学习阶段规划</h3><h4>第一阶段：AI基础（1-2周）</h4><p>目标：理解大模型基本原理，掌握Prompt Engineering基础。</p><ul><li>Transformer架构与注意力机制</li><li>GPT/BERT模型原理</li><li>Tokenization与推理参数</li><li>Prompt Engineering方法</li></ul><h4>第二阶段：平台能力（2-3周）</h4><p>目标：熟悉ADP平台各项功能，能够独立搭建应用。</p><ul><li>ADP平台架构与操作</li><li>知识库构建与优化</li><li>RAG系统设计与评测</li><li>模型接入与管理</li></ul><h4>第三阶段：开发实战（3-4周）</h4><p>目标：掌握Agent开发全流程，能够设计复杂工作流。</p><ul><li>单Agent构建与调试</li><li>工具调用与MCP协议</li><li>工作流编排（标准模式/单工作流）</li><li>Multi-Agent协作设计</li></ul><h4>第四阶段：方案设计（2-3周）</h4><p>目标：具备客户需求分析和方案设计能力。</p><ul><li>SPIN需求分析方法</li><li>方案适配性评估</li><li>行业场景解决方案</li><li>技术规格书编写</li></ul><h4>第五阶段：冲刺备考（2周）</h4><p>目标：通过模拟考试查漏补缺，达到考试要求。</p><ul><li>综合复习与薄弱点强化</li><li>模拟考试（至少3次）</li><li>高频考点速记</li></ul>'},
    {id:'fde-70pages',title:'FDE入门指南（70页）',category:'学习指南',type:'external',url:'https://m.sohu.com/a/1084907755_121124365/',description:'全面的FDE入门指南，涵盖FDE角色定义、核心技能和发展路径。',content:'<h3>FDE角色定义</h3><p>FDE（Forward Deployed Engineer，前沿部署工程师）是驻扎在客户现场的技术角色，兼具工程能力与业务理解力。FDE的概念最早源自Palantir，在AI 3.0时代（大模型+Agent时代）发挥着越来越重要的作用。</p><h3>核心技能要求</h3><h4>技术能力</h4><ul><li>大模型原理与应用（Transformer、LLM、Prompt Engineering）</li><li>AI Agent开发（感知-推理-行动循环、工具使用、记忆系统）</li><li>RAG系统设计（知识库构建、检索优化、效果评测）</li><li>工作流编排（节点设计、变量传递、错误处理）</li><li>云原生基础（容器化、Kubernetes、CI/CD）</li></ul><h4>业务能力</h4><ul><li>客户需求分析（SPIN框架、痛点识别）</li><li>方案设计（能力映射、技术规格书）</li><li>项目管理（POC验证、交付实施）</li><li>沟通协作（干系人管理、期望管理）</li></ul><h4>行业知识</h4><ul><li>金融行业（智能客服、风控、合规）</li><li>政务行业（政策问答、等保要求）</li><li>制造业（质检、预测性维护）</li><li>零售业（智能推荐、库存优化）</li><li>医疗行业（医疗问答、合规要求）</li><li>教育行业（智能辅导、内容生成）</li></ul><h3>发展路径</h3><p>FDE的职业发展路径通常为：初级FDE → 高级FDE → FDE技术专家 → FDE团队负责人。随着AI在企业中的深入应用，FDE的需求将持续增长。</p>'},
    {id:'fde-tutorial-series',title:'FDE学习系列教程大纲',category:'学习指南',type:'external',url:'https://cloud.tencent.com/product/adx',description:'腾讯云官方FDE系列教程，包含从基础到高级的完整课程体系。',content:'<h3>课程大纲</h3><h4>模块一：AI与生成式AI基础</h4><ul><li>AI发展历程（1.0→2.0→3.0）</li><li>Transformer架构原理</li><li>大语言模型（LLM）基础</li><li>Prompt Engineering方法</li><li>AI Agent概念与架构</li></ul><h4>模块二：ADP核心功能</h4><ul><li>ADP平台概述与架构</li><li>应用类型与创建流程</li><li>模型接入与管理</li><li>知识库系统（分块策略、向量化）</li><li>RAG检索增强生成</li><li>知识库高级功能（引用溯源、质量评估）</li></ul><h4>模块三：智能体开发</h4><ul><li>单Agent构建（系统提示词设计）</li><li>工具调用与函数调用（MCP协议）</li><li>工作流编排基础</li><li>标准模式工作流（并行、循环、子工作流）</li><li>Multi-Agent协作模式</li></ul><h4>模块四：场景理解与方案设计</h4><ul><li>客户需求分析方法（SPIN、TDD）</li><li>智能体方案适配性评估</li><li>方案设计方法论</li><li>行业场景：金融、政务、制造、零售、医疗、教育</li></ul><h4>模块五：交付实施与运维</h4><ul><li>POC快速验证</li><li>效果评测方法论</li><li>RAG效果评测（recall@k、MRR、NDCG）</li><li>性能优化与成本优化</li><li>监控与可观测性</li></ul><h4>模块六：安全合规</h4><ul><li>数据权限与隐私保护</li><li>内容安全</li><li>模型幻觉与越权访问</li><li>合规边界与责任AI</li></ul><h4>模块七：云原生部署</h4><ul><li>容器化基础（Docker）</li><li>Kubernetes基础</li><li>CI/CD与DevOps</li><li>模型推理部署（vLLM、量化）</li><li>网络与安全</li></ul>'},
    {id:'fde-github-book',title:'FDE前沿部署工程师指南（GitHub）',category:'GitHub资源',type:'github',url:'https://github.com/xdash/FDE-the-Guidance-Book-of-Forward-Deployed-Engineer',description:'社区编写的FDE完整指南，范冰著。涵盖FDE角色、技能要求、工作流程和最佳实践。全书免费公开。',content:'<h3>关于本书</h3><p>《前线部署工程师：人工智能时代的客户价值交付秘籍》，范冰（XDash）著。2025年夏天，麻省理工学院报告显示全球企业在生成式AI上投入三四百亿美元，其中95%的项目未能产生可量化的价值。与此同时，FDE岗位发布量一年暴涨七倍。本书系统研究了FDE这一角色的起源、方法论和实践案例。</p><blockquote><p>核心观点：模型已经不稀缺了，能把模型塞进客户真实业务里的人，才稀缺。</p></blockquote><h3>全书目录</h3><h4>自序</h4><p>介绍FDE概念的背景和研究方法。作者通过翻遍一手材料（Palantir早期高管播客、前员工回忆录、风投分析、MIT报告、招聘启事等）系统梳理FDE岗位。</p><h4>第1章：FDE的崛起</h4><ul><li>FDE概念的起源：从Palantir情报项目到AI时代</li><li>FDE与传统售前/售后工程师的本质区别</li><li>为什么FDE在AI 3.0时代爆发（大模型+Agent时代）</li><li>FDE的核心价值：桥接业务需求与技术实现</li></ul><h4>第2章：解决正确的问题</h4><ul><li>需求分析方法论：如何识别客户的真实痛点</li><li>区分表面需求和根本问题</li><li>可行性评估：技术、成本、时间三维度</li><li>AI适用性判断：什么场景适合用AI解决</li></ul><h4>第3章：赢得客户</h4><ul><li>客户沟通与信任建立</li><li>POC（概念验证）的设计与执行</li><li>方案演示与价值呈现</li><li>处理客户异议与顾虑</li></ul><h4>第4章：激活部署</h4><ul><li>从POC到生产环境的交付流程</li><li>系统集成与数据对接</li><li>用户培训与变更管理</li><li>上线初期的支持与优化</li></ul><h4>第5章：守住续约</h4><ul><li>客户成功管理</li><li>持续价值交付与效果追踪</li><li>续约策略与风险预警</li><li>客户满意度提升方法</li></ul><h4>第6章：扩大收入</h4><ul><li>交叉销售与追加销售</li><li>从单点应用到平台化扩展</li><li>客户案例沉淀与复用</li><li>生态合作与渠道建设</li></ul><h4>第7章：规模化复制</h4><ul><li>FDE团队的建设与管理</li><li>知识沉淀与标准化流程</li><li>从项目制到产品化</li><li>FDE能力的组织化传承</li></ul><h4>第8章：完整案例集</h4><ul><li>165个真实可查的案例</li><li>涵盖Palantir、OpenAI、Anthropic、Harvey、Sierra等公司</li><li>中国第一批FDE实践者的经验</li><li>跨行业案例：金融、政务、制造、零售、医疗、教育</li></ul><h4>后记：FDE的职业道德</h4><p>讨论FDE在实践中应遵循的职业道德准则，包括客户利益优先、数据隐私保护、技术诚实等。</p><h4>附录A：FDE应当关注的常用指标</h4><ul><li>客户健康度指标</li><li>项目交付指标</li><li>业务价值指标</li><li>团队效能指标</li></ul><h4>附录B：FDE人物与团队名单</h4><p>整理全球范围内知名的FDE从业者和团队，供学习参考。</p><h4>附录C：全书案例索引与资料出处</h4><p>所有引用数据和案例的来源标注，确保可核查性。</p><h3>核心要点总结</h3><h4>FDE是什么</h4><p>FDE（Forward Deployed Engineer）是驻扎在客户现场的技术角色，兼具工程能力与业务理解力。FDE不是售前也不是售后，而是端到端交付客户价值的"全栈问题解决者"。</p><h4>FDE的核心技能</h4><ul><li><strong>技术能力</strong>：全栈工程、AI/ML基础、云原生、系统集成</li><li><strong>业务能力</strong>：需求分析、方案设计、项目管理、ROI评估</li><li><strong>软技能</strong>：沟通协作、客户管理、期望管理、冲突解决</li></ul><h4>FDE的工作流程</h4><ol><li>发现与识别客户的真实问题</li><li>设计技术方案并验证可行性（POC）</li><li>赢得客户信任并签约</li><li>激活部署并确保上线成功</li><li>持续交付价值并守住续约</li><li>扩大收入并规模化复制</li></ol><blockquote><p>本书官网：fde4.ai，可在线阅读全文或下载PDF。本系统已提取核心内容供离线学习参考。</p></blockquote>'},
    {id:'ai-agents-beginners',title:'AI Agents入门（Microsoft）',category:'GitHub资源',type:'github',url:'https://github.com/microsoft/ai-agents-for-beginners',description:'微软官方AI Agents入门课程，18节课系统讲解AI Agent的概念、架构、设计模式和开发方法。含代码示例。',content:'<h3>课程介绍</h3><p>微软官方推出的AI Agents入门课程（AI Agents for Beginners），教授构建AI Agent所需的全部知识。课程包含18节课，涵盖从基础概念到生产部署的完整内容，每节课都配有代码示例。</p><h3>课程大纲（18节课）</h3><h4>Lesson 0: 课程设置</h4><p>开发环境配置、工具安装、课程结构介绍。</p><h4>Lesson 1: AI Agents简介与用例</h4><ul><li>什么是AI Agent？定义与核心特征</li><li>Agent与传统AI的区别：自主性、反应性、主动性、社交能力</li><li>Agent的典型应用场景</li><li>Agent的价值主张</li></ul><h4>Lesson 2: 探索Agentic框架</h4><ul><li>主流AI Agent开发框架介绍</li><li>框架对比与选型指南</li><li>框架的核心组件与架构</li><li>实战：使用框架构建简单Agent</li></ul><h4>Lesson 3: 理解Agentic设计模式</h4><ul><li>Agent设计的核心原则</li><li>常见设计模式概述</li><li>如何选择合适的模式</li><li>设计模式的最佳实践</li></ul><h4>Lesson 4: 工具使用设计模式</h4><ul><li>Tool Use Design Pattern详解</li><li>工具定义与注册</li><li>Agent如何选择和调用工具</li><li>工具编排与错误处理</li><li>实战：构建带工具调用能力的Agent</li></ul><h4>Lesson 5: Agentic RAG</h4><ul><li>RAG在Agent中的应用</li><li>Agent如何主动检索信息</li><li>多轮检索与迭代优化</li><li>RAG Agent的设计要点</li></ul><h4>Lesson 6: 构建可信赖的Agent</h4><ul><li>Agent安全性设计</li><li>权限控制与最小权限原则</li><li>防止Prompt注入攻击</li><li>输出审核与内容安全</li><li>负责任AI原则在Agent中的实践</li></ul><h4>Lesson 7: 规划设计模式</h4><ul><li>Planning Design Pattern详解</li><li>Agent如何分解复杂任务</li><li>任务规划与执行策略</li><li>动态调整与重规划</li></ul><h4>Lesson 8: Multi-Agent设计模式</h4><ul><li>Multi-Agent架构模式</li><li>Agent间通信机制</li><li>任务分解与协调策略</li><li>冲突解决与结果汇总</li><li>实战：构建Multi-Agent系统</li></ul><h4>Lesson 9: 元认知设计模式</h4><ul><li>Metacognition Design Pattern</li><li>Agent的自我反思与评估</li><li>自我改进机制</li><li>元认知在复杂任务中的应用</li></ul><h4>Lesson 10: 生产环境中的Agent</h4><ul><li>Agent从开发到生产的流程</li><li>生产环境的特殊要求</li><li>监控与可观测性</li><li>性能优化与成本控制</li></ul><h4>Lesson 11: 使用Agentic协议（MCP、A2A、NLWeb）</h4><ul><li>MCP（Model Context Protocol）详解</li><li>A2A（Agent-to-Agent）协议</li><li>NLWeb协议</li><li>协议选型与集成</li></ul><h4>Lesson 12: Agent的上下文工程</h4><ul><li>Context Engineering for AI Agents</li><li>如何为Agent构建有效上下文</li><li>上下文窗口管理</li><li>上下文压缩与优化</li></ul><h4>Lesson 13: Agent记忆管理</h4><ul><li>Managing Agentic Memory</li><li>短期记忆（对话上下文）</li><li>长期记忆（向量数据库）</li><li>记忆检索与更新策略</li></ul><h4>Lesson 14: 微软Agent框架探索</h4><ul><li>Microsoft Agent Framework介绍</li><li>框架核心功能</li><li>与其他框架的对比</li><li>实战：使用微软框架构建Agent</li></ul><h4>Lesson 15: 构建计算机使用Agent（CUA）</h4><ul><li>Computer Use Agents概念</li><li>浏览器自动化Agent</li><li>GUI操作与交互</li><li>CUA的应用场景与限制</li></ul><h4>Lesson 16: 部署可扩展的Agent</h4><ul><li>Agent的规模化部署</li><li>负载均衡与弹性伸缩</li><li>多租户架构</li><li>高可用设计</li></ul><h4>Lesson 17: 创建本地AI Agent</h4><ul><li>本地Agent的优势</li><li>本地模型选择与部署</li><li>离线Agent设计</li><li>隐私保护与数据安全</li></ul><h4>Lesson 18: 保护AI Agent安全</h4><ul><li>Agent安全威胁分析</li><li>安全架构设计</li><li>安全测试与审计</li><li>安全运维最佳实践</li></ul><h3>课程特色</h3><ul><li><strong>18节完整课程</strong>：从入门到生产部署全覆盖</li><li><strong>代码示例</strong>：每节课配有可运行的代码</li><li><strong>多语言支持</strong>：支持50+语言翻译，包括简体中文</li><li><strong>实战导向</strong>：注重实际应用而非纯理论</li><li><strong>微软生态</strong>：深度集成微软AI工具和框架</li></ul><h3>与FDE认证的关系</h3><p>本课程与腾讯云FDE认证高度互补：</p><ul><li>Lesson 1-3 对应 FDE模块1（AI基础）</li><li>Lesson 4-5 对应 FDE模块2（RAG系统）</li><li>Lesson 6 对应 FDE模块6（安全合规）</li><li>Lesson 7-9 对应 FDE模块3（Agent开发）</li><li>Lesson 10-11 对应 FDE模块5（交付运维）</li><li>Lesson 16-18 对应 FDE模块7（云原生部署）</li></ul><blockquote><p>建议：结合本系统的FDE学习内容，同步学习本课程对应章节，可获得更全面的Agent开发能力。访问原链接获取最新代码示例和多语言翻译版本。</p></blockquote>'}

function getReadingProgress() {
    let p = localStorage.getItem('fde_readingProgress');
    if (!p) { p = '{}'; localStorage.setItem('fde_readingProgress', p); }
    return JSON.parse(p);
}
function saveReadingProgress(resId, scrollPct) {
    let p = getReadingProgress();
    if (!p[resId]) p[resId] = {readPercent:0, lastRead:null, scrollPosition:0};
    p[resId].readPercent = Math.min(100, Math.round(scrollPct));
    p[resId].lastRead = todayStr();
    saveReadingProgressData(p);
}
function saveReadingProgressData(p) { localStorage.setItem('fde_readingProgress', JSON.stringify(p)); }

let selectedResource = null;
function renderResources() {
    if (!selectedResource) selectedResource = RESOURCES[0].id;
    let readingProg = getReadingProgress();
    
    // Build sidebar
    let sidebar = '<div class="resource-sidebar">';
    let currentCat = '';
    let groupOpen = false;
    
    RESOURCES.forEach(res => {
        if (res.category !== currentCat) {
            if (groupOpen) sidebar += '</div>'; // Close previous group
            currentCat = res.category;
            sidebar += '<div class="res-group">';
            sidebar += '<div class="res-group-title">' + currentCat + '</div>';
            groupOpen = true;
        }
        let prog = readingProg[res.id];
        let pct = prog ? prog.readPercent : 0;
        let active = res.id === selectedResource ? ' active' : '';
        sidebar += '<div class="res-item' + active + '" onclick="selectResource(\'' + res.id + '\')">';
        sidebar += '<div class="res-title"><span>' + res.title + '</span></div>';
        sidebar += '<div class="res-meta"><span>' + (pct > 0 ? '已读' + pct + '%' : '未读') + '</span>';
        sidebar += '<span>' + (prog && prog.lastRead ? '上次: ' + prog.lastRead.substring(5) : '') + '</span></div>';
        sidebar += '<div class="res-progress"><div class="fill" style="width:' + pct + '%"></div></div>';
        sidebar += '</div>';
    });
    
    if (groupOpen) sidebar += '</div>'; // Close last group
    sidebar += '</div>'; // Close resource-sidebar
    
    // Build main content
    let res = RESOURCES.find(r => r.id === selectedResource);
    if (!res) {
        document.getElementById('view-resources').innerHTML = sidebar;
        return;
    }
    
    let prog = readingProg[res.id];
    let pct = prog ? prog.readPercent : 0;
    let main = '<div class="resource-main">';
    main += '<div class="res-header">';
    main += '<h2>' + res.title + '</h2>';
    main += '<div class="res-info">';
    main += '<span>分类: ' + res.category + '</span>';
    main += '<span>类型: ' + (res.type === 'github' ? 'GitHub' : '外部资源') + '</span>';
    main += '<span>阅读进度: <strong style="color:' + (pct >= 80 ? 'var(--success)' : pct > 0 ? 'var(--warning)' : 'var(--text3)') + '">' + pct + '%</strong></span>';
    if (prog && prog.lastRead) main += '<span>上次阅读: ' + prog.lastRead + '</span>';
    main += '</div></div>';
    main += '<div class="res-content" id="resContentArea">' + res.content + '</div>';
    
    if (res.url) {
        main += '<a class="res-external-link" href="' + res.url + '" target="_blank">访问原始资源 ↗</a>';
    }
    
    main += '<div class="res-nav">';
    let idx = RESOURCES.findIndex(r => r.id === selectedResource);
    if (idx > 0) {
        main += '<button class="btn btn-outline" onclick="selectResource(\'' + RESOURCES[idx-1].id + '\')">← 上一篇</button>';
    } else {
        main += '<div></div>';
    }
    
    if (pct > 0 && pct < 100) {
        main += '<button class="btn btn-primary" onclick="continueReading()">继续阅读</button>';
    } else if (pct < 100) {
        main += '<button class="btn btn-success" onclick="markAsRead()">标记为已读</button>';
    } else {
        main += '<button class="btn btn-success" disabled>已完成阅读</button>';
    }
    
    if (idx < RESOURCES.length - 1) {
        main += '<button class="btn btn-outline" onclick="selectResource(\'' + RESOURCES[idx+1].id + '\')">下一篇 →</button>';
    } else {
        main += '<div></div>';
    }
    main += '</div></div>'; // Close res-nav and resource-main
    
    // Combine into layout
    document.getElementById('view-resources').innerHTML = '<div class="resource-layout">' + sidebar + main + '</div>';
    
    // Track reading progress via scroll
    setTimeout(trackReadingProgress, 100);
}
function selectResource(id) { selectedResource = id; renderResources(); }
function trackReadingProgress() {
    let contentArea = document.getElementById('resContentArea');
    let mainArea = document.querySelector('.resource-main');
    if (!contentArea || !mainArea) return;
    mainArea.addEventListener('scroll', function() {
        let scrollTop = mainArea.scrollTop;
        let scrollHeight = contentArea.offsetHeight;
        let clientHeight = mainArea.clientHeight;
        let pct = Math.min(100, Math.round((scrollTop / (scrollHeight - clientHeight)) * 100));
        if (selectedResource && pct > 0) {
            saveReadingProgress(selectedResource, pct);
            // Update sidebar progress display
            let items = document.querySelectorAll('.res-item');
            items.forEach(item => {
                if (item.onclick && item.onclick.toString().includes(selectedResource)) {
                    let meta = item.querySelector('.res-meta');
                    if (meta) meta.innerHTML = '<span>已读' + pct + '%</span><span>上次: ' + todayStr().substring(5) + '</span>';
                    let fill = item.querySelector('.res-progress .fill');
                    if (fill) fill.style.width = pct + '%';
                }
            });
        }
    });
}
function continueReading() {
    let mainArea = document.querySelector('.resource-main');
    if (!mainArea) return;
    let prog = getReadingProgress();
    let resProg = prog[selectedResource];
    if (resProg && resProg.scrollPosition > 0) {
        mainArea.scrollTop = resProg.scrollPosition;
    } else {
        mainArea.scrollTop = 300;
    }
}
function markAsRead() {
    if (selectedResource) {
        saveReadingProgress(selectedResource, 100);
        renderResources();
    }
}

// ==================== KNOWLEDGE SUMMARIES ====================
let selectedSummary = null;
let summaryFilter = 'all';
let summarySearch = '';

function renderSummaries() {
    let summaries = getSummaries();
    let term = summarySearch.trim();
    let filtered = summaries.filter(s => {
        let matchCategory = summaryFilter === 'all' || s.category === summaryFilter;
        let matchSearch = !summarySearch || 
            s.title.toLowerCase().includes(summarySearch.toLowerCase()) ||
            stripMarks(s.content).toLowerCase().includes(summarySearch.toLowerCase()) ||
            (s.tags && s.tags.some(t => t.toLowerCase().includes(summarySearch.toLowerCase())));
        return matchCategory && matchSearch;
    });
    
    // Sort by updatedAt desc
    filtered.sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
    
    // Sidebar
    let sidebar = '<div class="summary-sidebar">';
    sidebar += '<button class="btn btn-primary" style="width:100%;margin-bottom:16px" onclick="showAddSummaryForm()">+ 添加摘要</button>';
    sidebar += '<input type="text" class="search-box" placeholder="搜索标题、内容、标签..." value="' + summarySearch + '" oninput="summarySearch=this.value;renderSummaries()">';
    
    // Category filter
    sidebar += '<div class="filter-section">';
    sidebar += '<div class="filter-title">分类筛选</div>';
    let categories = ['all', ...MODULE_NAMES.filter(n => n)];
    categories.forEach(cat => {
        let active = summaryFilter === cat ? ' active' : '';
        let label = cat === 'all' ? '全部' : cat;
        sidebar += '<div class="filter-item' + active + '" onclick="summaryFilter=\'' + cat + '\';renderSummaries()">' + label + '</div>';
    });
    sidebar += '</div>';
    
    // Summary list
    sidebar += '<div class="summary-list">';
    if (filtered.length === 0) {
        sidebar += '<div style="text-align:center;padding:20px;color:var(--text3);font-size:13px">暂无摘要</div>';
    } else {
        filtered.forEach(s => {
            let active = selectedSummary === s.id ? ' active' : '';
            sidebar += '<div class="summary-item' + active + '" onclick="selectSummary(\'' + s.id + '\')">';
            sidebar += '<div class="s-title">' + emitText(s.title, term) + '</div>';
            sidebar += '<div class="s-meta">' + s.category + ' · ' + s.updatedAt.substring(5) + '</div>';
            sidebar += '</div>';
        });
    }
    sidebar += '</div></div>';
    
    // Main content
    let main = '<div class="summary-main">';
    if (!selectedSummary) {
        main += '<div class="empty-state">';
        main += '<div class="empty-icon">📝</div>';
        main += '<h3>知识摘要</h3>';
        main += '<p style="margin-top:8px">从学习资料中收集重点知识，方便后期复习</p>';
        main += '<button class="btn btn-primary mt-16" onclick="showAddSummaryForm()">添加第一条摘要</button>';
        main += '</div>';
    } else {
        let s = summaries.find(x => x.id === selectedSummary);
        if (s) {
            main += '<div class="summary-header">';
            main += '<h2>' + emitText(s.title, term) + '</h2>';
            main += '<div class="summary-meta">';
            main += '<span>分类: ' + s.category + '</span>';
            main += '<span>来源: ' + (s.source || '未标注') + '</span>';
            main += '<span>创建: ' + s.createdAt + '</span>';
            main += '<span>更新: ' + s.updatedAt + '</span>';
            if (s.tags && s.tags.length > 0) {
                main += '<span>标签: ' + s.tags.map(t => '<span class="badge badge-primary" style="margin-left:4px">' + t + '</span>').join('') + '</span>';
            }
            main += '</div></div>';
            main += '<div class="summary-content">' + renderMarks(s.content, term) + '</div>';
            main += '<div class="summary-actions">';
            main += '<button class="btn btn-outline" onclick="editSummary(\'' + s.id + '\')">编辑</button>';
            main += '<button class="btn btn-error" onclick="deleteSummary(\'' + s.id + '\')">删除</button>';
            main += '</div>';
        }
    }
    main += '</div>';
    
    let searchHadFocus = document.activeElement && document.activeElement.classList.contains('search-box');
    document.getElementById('view-summaries').innerHTML = '<div class="summary-layout">' + sidebar + main + '</div>';
    if (searchHadFocus) {
        let box = document.querySelector('#view-summaries .search-box');
        if (box) { box.focus(); box.setSelectionRange(box.value.length, box.value.length); }
    }
    if (term) {
        let hit = document.querySelector('.summary-main .find-hit');
        if (hit) hit.scrollIntoView({ block: 'center' });
    }
}

function selectSummary(id) {
    selectedSummary = id;
    renderSummaries();
}

function showAddSummaryForm() {
    showSummaryModal(summaryFormHtml('添加知识摘要', null, 'saveNewSummary()'));
}

function saveNewSummary() {
    let title = document.getElementById('sumTitle').value.trim();
    let category = document.getElementById('sumCategory').value;
    let source = document.getElementById('sumSource').value.trim();
    let content = document.getElementById('sumContent').value.trim();
    let tagsStr = document.getElementById('sumTags').value.trim();
    
    if (!title || !content) {
        alert('请填写标题和内容');
        return;
    }
    
    let summaries = getSummaries();
    let newSummary = {
        id: 's' + Date.now(),
        title: title,
        content: content,
        source: source,
        category: category,
        tags: tagsStr ? tagsStr.split(/[,，]/).map(t => t.trim()).filter(t => t) : [],
        createdAt: todayStr(),
        updatedAt: todayStr()
    };
    
    summaries.push(newSummary);
    saveSummaries(summaries);
    selectedSummary = newSummary.id;
    closeModal();
    renderSummaries();
}

function editSummary(id) {
    let summaries = getSummaries();
    let s = summaries.find(x => x.id === id);
    if (!s) return;
    showSummaryModal(summaryFormHtml('编辑知识摘要', s, "updateSummary('" + id + "')"));
}

function updateSummary(id) {
    let title = document.getElementById('sumTitle').value.trim();
    let category = document.getElementById('sumCategory').value;
    let source = document.getElementById('sumSource').value.trim();
    let content = document.getElementById('sumContent').value.trim();
    let tagsStr = document.getElementById('sumTags').value.trim();
    
    if (!title || !content) {
        alert('请填写标题和内容');
        return;
    }
    
    let summaries = getSummaries();
    let idx = summaries.findIndex(x => x.id === id);
    if (idx === -1) return;
    
    summaries[idx].title = title;
    summaries[idx].category = category;
    summaries[idx].source = source;
    summaries[idx].content = content;
    summaries[idx].tags = tagsStr ? tagsStr.split(/[,，]/).map(t => t.trim()).filter(t => t) : [];
    summaries[idx].updatedAt = todayStr();
    
    saveSummaries(summaries);
    closeModal();
    renderSummaries();
}

function deleteSummary(id) {
    if (!confirm('确定要删除这条摘要吗？')) return;
    let summaries = getSummaries();
    summaries = summaries.filter(x => x.id !== id);
    saveSummaries(summaries);
    selectedSummary = null;
    renderSummaries();
}

function escHtml(v) {
    return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function summaryFormHtml(heading, s, onSubmit) {
    let tags = s && s.tags ? s.tags.join(', ') : '';
    let html = '<div class="modal-title">' + heading + '</div>';
    html += '<button class="modal-close" onclick="closeModal()">✕</button>';
    html += '<div class="summary-form">';
    html += '<label>标题</label><input type="text" id="sumTitle" placeholder="摘要标题" value="' + escHtml(s ? s.title : '') + '">';
    html += '<div class="form-row">';
    html += '<div><label>分类</label><select id="sumCategory">';
    MODULE_NAMES.filter(n => n).forEach(m => {
        let selected = s && s.category === m ? ' selected' : '';
        html += '<option value="' + m + '"' + selected + '>' + m + '</option>';
    });
    html += '</select></div>';
    html += '<div><label>来源</label><input type="text" id="sumSource" placeholder="如：FDE指南第3章" value="' + escHtml(s ? s.source : '') + '"></div>';
    html += '</div>';
    html += '<div class="label-row"><label>内容</label><button class="btn-mini" type="button" onclick="openBigEditor(\'sumContent\')">⤢ 放大输入</button></div>';
    html += '<textarea id="sumContent" ondblclick="openBigEditor(\'sumContent\')" placeholder="粘贴或输入知识要点……（双击本框打开大窗口书写，或点右上角“放大输入”）">' + escHtml(s ? s.content : '') + '</textarea>';
    html += '<label>标签（用逗号分隔）</label><input type="text" id="sumTags" placeholder="如：RAG, Agent, 工作流" value="' + escHtml(tags) + '">';
    html += '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px">';
    html += '<button class="btn btn-outline" onclick="closeModal()">取消</button>';
    html += '<button class="btn btn-primary" onclick="' + onSubmit + '">' + (s ? '更新' : '保存') + '</button>';
    html += '</div></div>';
    return html;
}

function showSummaryModal(html) {
    showModal(html);
    document.getElementById('modalContent').classList.add('wide');
}

const MARK_CLASS = { y:'mk-y', g:'mk-g', r:'mk-r', b:'mk-b', tr:'mk-tr', tb:'mk-tb' };
const MARK_RE = /\{\{(y|g|r|b|tr|tb)\|([\s\S]*?)\}\}/g;

function stripMarks(t) {
    return String(t == null ? '' : t).replace(MARK_RE, '$2');
}

function escapeRegExp(s) {
    return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function emitText(raw, term) {
    if (!term) return escHtml(raw);
    let re = new RegExp(escapeRegExp(term), 'gi');
    let out = '', last = 0, m;
    while ((m = re.exec(raw))) {
        if (!m[0]) { re.lastIndex++; continue; }
        out += escHtml(raw.slice(last, m.index));
        out += '<mark class="find-hit">' + escHtml(m[0]) + '</mark>';
        last = m.index + m[0].length;
    }
    return out + escHtml(raw.slice(last));
}

function renderMarks(t, term) {
    let s = String(t == null ? '' : t), out = '', last = 0, m;
    MARK_RE.lastIndex = 0;
    while ((m = MARK_RE.exec(s))) {
        out += emitText(s.slice(last, m.index), term);
        out += '<span class="' + MARK_CLASS[m[1]] + '">' + emitText(m[2], term) + '</span>';
        last = m.index + m[0].length;
    }
    return out + emitText(s.slice(last), term);
}

function applyMark(code) {
    if (isMarkPreviewOn()) { alert('请先点"继续编辑"退出预览模式'); return; }
    let et = document.getElementById('editorText');
    let a = et.selectionStart, b = et.selectionEnd;
    if (a === b) { alert('请先在内容里选中要标记的文字'); return; }
    let v = et.value, open = '{{' + code + '|', close = '}}';
    let sel = v.slice(a, b);
    if (v.slice(a - open.length, a) === open && v.slice(b, b + close.length) === close) {
        et.value = v.slice(0, a - open.length) + sel + v.slice(b + close.length);
        setEditorSelection(et, a - open.length, a - open.length + sel.length);
    } else {
        sel = stripMarks(sel);
        et.value = v.slice(0, a) + open + sel + close + v.slice(b);
        setEditorSelection(et, a + open.length, a + open.length + sel.length);
    }
    updateEditorCount();
}

function clearMark() {
    if (isMarkPreviewOn()) { alert('请先点"继续编辑"退出预览模式'); return; }
    let et = document.getElementById('editorText');
    let a = et.selectionStart, b = et.selectionEnd;
    if (a === b) { alert('请先选中要去掉标记的文字'); return; }
    let v = et.value, sel = stripMarks(v.slice(a, b));
    et.value = v.slice(0, a) + sel + v.slice(b);
    setEditorSelection(et, a, a + sel.length);
    updateEditorCount();
}

function setEditorSelection(et, a, b) {
    et.focus();
    et.setSelectionRange(a, b);
}

function isMarkPreviewOn() {
    return document.getElementById('editorPreview').style.display === 'block';
}

function toggleMarkPreview() {
    let et = document.getElementById('editorText');
    let pv = document.getElementById('editorPreview');
    let btn = document.getElementById('mkPreviewBtn');
    if (pv.style.display === 'block') {
        pv.style.display = 'none';
        et.style.display = 'block';
        btn.textContent = '👁 预览高亮';
        et.focus();
    } else {
        pv.innerHTML = renderMarks(et.value) || '<span style="color:var(--text3)">（暂无内容）</span>';
        pv.style.display = 'block';
        et.style.display = 'none';
        btn.textContent = '✎ 继续编辑';
    }
}

function resetMarkPreview() {
    let pv = document.getElementById('editorPreview');
    if (pv.style.display === 'block') toggleMarkPreview();
}

let editorTarget = null;

function openBigEditor(targetId) {
    let ta = document.getElementById(targetId);
    if (!ta) return;
    editorTarget = ta;
    let p = document.getElementById('editorPanel');
    document.getElementById('editorOverlay').classList.add('show');
    p.style.display = 'flex';
    if (!p.dataset.placed) {
        let w = Math.min(800, window.innerWidth - 32);
        let h = Math.min(600, window.innerHeight - 32);
        p.style.width = w + 'px';
        p.style.height = h + 'px';
        p.style.left = Math.round((window.innerWidth - w) / 2) + 'px';
        p.style.top = Math.round((window.innerHeight - h) / 2) + 'px';
        p.dataset.placed = '1';
    }
    let et = document.getElementById('editorText');
    et.value = ta.value;
    updateEditorCount();
    resetMarkPreview();
    et.focus();
    et.setSelectionRange(et.value.length, et.value.length);
}

function closeBigEditor(save) {
    resetMarkPreview();
    document.getElementById('editorOverlay').classList.remove('show');
    document.getElementById('editorPanel').style.display = 'none';
    if (save && editorTarget) {
        editorTarget.value = document.getElementById('editorText').value;
        editorTarget.dispatchEvent(new Event('input', { bubbles: true }));
        editorTarget.focus();
    }
    editorTarget = null;
}

function updateEditorCount() {
    let v = document.getElementById('editorText').value;
    document.getElementById('editorCount').textContent = stripMarks(v).length + ' 字 / ' + stripMarks(v).split('\n').length + ' 行';
}

function expandEditor() {
    let p = document.getElementById('editorPanel');
    if (p.dataset.expanded === '1') {
        let r = JSON.parse(p.dataset.prevRect);
        p.style.left = r.left + 'px'; p.style.top = r.top + 'px';
        p.style.width = r.width + 'px'; p.style.height = r.height + 'px';
        p.dataset.expanded = '0';
    } else {
        p.dataset.prevRect = JSON.stringify(p.getBoundingClientRect());
        p.style.left = '16px'; p.style.top = '16px';
        p.style.width = (window.innerWidth - 32) + 'px';
        p.style.height = (window.innerHeight - 32) + 'px';
        p.dataset.expanded = '1';
    }
}

function startEditorDrag(e, mode) {
    e.preventDefault();
    let p = document.getElementById('editorPanel');
    let r = p.getBoundingClientRect();
    let sx = e.clientX, sy = e.clientY;
    document.body.style.userSelect = 'none';
    let move = ev => {
        let dx = ev.clientX - sx, dy = ev.clientY - sy;
        if (mode === 'move') {
            p.style.left = Math.max(80 - r.width, Math.min(window.innerWidth - 80, r.left + dx)) + 'px';
            p.style.top = Math.max(0, Math.min(window.innerHeight - 40, r.top + dy)) + 'px';
        } else {
            p.style.width = Math.max(360, Math.min(window.innerWidth - r.left, r.width + dx)) + 'px';
            p.style.height = Math.max(220, Math.min(window.innerHeight - r.top, r.height + dy)) + 'px';
        }
        p.dataset.expanded = '0';
    };
    let up = () => {
        document.body.style.userSelect = '';
        window.removeEventListener('pointermove', move);
        window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
}

document.getElementById('editorHead').addEventListener('pointerdown', e => {
    if (e.target.closest('.modal-close')) return;
    startEditorDrag(e, 'move');
});
document.getElementById('editorResize').addEventListener('pointerdown', e => startEditorDrag(e, 'resize'));
document.getElementById('editorOverlay').addEventListener('click', () => closeBigEditor(false));
document.getElementById('editorText').addEventListener('input', updateEditorCount);
document.getElementById('editorText').addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); closeBigEditor(true); }
    else if (e.key === 'Escape') { e.preventDefault(); closeBigEditor(false); }
});

function showModal(html) {
    document.getElementById('modalContent').innerHTML = html;
    document.getElementById('modalOverlay').classList.add('show');
}

function closeModal() {
    if (document.getElementById('editorPanel').style.display !== 'none') closeBigEditor(false);
    document.getElementById('modalContent').classList.remove('wide');
    document.getElementById('modalOverlay').classList.remove('show');
}
